<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ASCII Motion</title>
<style>
  :root {
    --bg: #111113;
    --panel: #18181b;
    --line: #2a2a30;
    --text: #e8e8ea;
    --muted: #8b8b94;
    --accent: #39ff14;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 13px/1.4 system-ui, -apple-system, sans-serif;
    display: grid;
    grid-template-columns: 290px 1fr;
    overflow: hidden;
  }
  aside {
    background: var(--panel);
    border-right: 1px solid var(--line);
    padding: 18px 18px 28px;
    overflow-y: auto;
  }
  h1 {
    font: 600 15px/1 ui-monospace, Menlo, monospace;
    letter-spacing: .08em;
    margin: 0 0 18px;
  }
  section { border-top: 1px solid var(--line); padding: 14px 0 6px; }
  h2 {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: .1em;
    color: var(--muted);
    margin: 0 0 10px;
  }
  label { display: block; margin-bottom: 10px; }
  label > span { display: flex; justify-content: space-between; margin-bottom: 4px; }
  label output { color: var(--muted); font-variant-numeric: tabular-nums; }
  input[type=range] { width: 100%; accent-color: var(--accent); }
  input[type=checkbox] { accent-color: var(--accent); margin-right: 6px; }
  select, input[type=text], button {
    width: 100%;
    background: #222227;
    color: var(--text);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 7px 9px;
    font: inherit;
  }
  button { cursor: pointer; }
  button:hover { border-color: #44444c; background: #2a2a30; }
  input[type=text] { font-family: ui-monospace, Menlo, monospace; margin-top: 6px; }
  [data-row] { display: flex; gap: 8px; }
  [data-row] > * { flex: 1; }
  input[type=color] {
    width: 100%;
    height: 34px;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: none;
    padding: 2px;
    cursor: pointer;
  }
  #swatches { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; margin: 10px 0; }
  #swatches button {
    height: 26px;
    padding: 0;
    border-radius: 5px;
  }
  #rec[data-on] { border-color: #ff4d4d; color: #ff6b6b; }
  [data-hint] { color: var(--muted); font-size: 12px; margin: 6px 0 0; }
  main {
    position: relative;
    display: grid;
    place-items: center;
    padding: 24px;
    overflow: hidden;
  }
  canvas { display: block; box-shadow: 0 10px 40px rgba(0,0,0,.5); }
  #drop {
    position: absolute;
    inset: 12px;
    border: 2px dashed var(--accent);
    border-radius: 12px;
    display: grid;
    place-items: center;
    font: 600 18px ui-monospace, Menlo, monospace;
    color: var(--accent);
    background: rgba(0,0,0,.6);
    opacity: 0;
    pointer-events: none;
    transition: opacity .15s;
  }
  body[data-drag] #drop { opacity: 1; }
  @media (max-width: 760px) {
    body { grid-template-columns: 1fr; grid-template-rows: 55vh auto; overflow: auto; }
    main { grid-row: 1; padding: 16px; }
    aside { grid-row: 2; border-right: 0; border-top: 1px solid var(--line); }
  }
</style>
</head>
<body>
<aside>
  <h1>ASCII MOTION</h1>

  <section>
    <h2>Image</h2>
    <button id="pick">Choose image…</button>
    <input id="file" type="file" accept="image/*" hidden>
    <p data-hint>Or drop / paste an image anywhere.</p>
  </section>

  <section>
    <h2>Characters</h2>
    <label>
      <select id="charset">
        <option value=" .:-=+*#%@">Standard</option>
        <option value=" .'`^,:;Il!i~+_-?][}{1)(|/tfjrxnuvczXYUJCLQ0OZmwqpdbkhao*#MW&8%B@$">Detailed</option>
        <option value=" ░▒▓█">Blocks</option>
        <option value=" ·•●">Dots</option>
        <option value=" 01">Binary</option>
        <option value=" ｱｲｳｴｵｶｷｸｹｺ">Katakana</option>
        <option value="custom">Custom…</option>
      </select>
      <input id="custom" type="text" value=" .oO@" hidden placeholder="dark → light">
    </label>
    <label><span>Cell size <output id="cellOut"></output></span>
      <input id="cell" type="range" min="5" max="36" value="12"></label>
  </section>

  <section>
    <h2>Tone</h2>
    <label><span>Contrast <output id="contrastOut"></output></span>
      <input id="contrast" type="range" min="0.5" max="3" step="0.05" value="1.3"></label>
    <label><span>Exposure <output id="exposureOut"></output></span>
      <input id="exposure" type="range" min="-0.5" max="0.5" step="0.01" value="0"></label>
    <label><input id="invert" type="checkbox">Invert</label>
  </section>

  <section>
    <h2>Colors</h2>
    <div data-row>
      <label><span>Background</span><input id="c1" type="color" value="#0b0b0b"></label>
      <label><span>Glyphs</span><input id="c2" type="color" value="#39ff14"></label>
    </div>
    <div id="swatches"></div>
    <div data-row>
      <button id="swap">Swap</button>
    </div>
    <label style="margin-top:10px"><input id="tonal" type="checkbox" checked>Tonal glyphs (fade into background)</label>
  </section>

  <section>
    <h2>Animation</h2>
    <label>
      <select id="mode">
        <option value="wave">Wave</option>
        <option value="liquid">Liquid</option>
        <option value="ripple">Ripple</option>
        <option value="scan">Scan line</option>
        <option value="glitch">Glitch</option>
        <option value="scramble">Scramble</option>
        <option value="rain">Rain</option>
        <option value="none">None</option>
      </select>
    </label>
    <label><span>Speed <output id="speedOut"></output></span>
      <input id="speed" type="range" min="0" max="3" step="0.05" value="1"></label>
    <label><span>Amount <output id="amountOut"></output></span>
      <input id="amount" type="range" min="0" max="1" step="0.01" value="0.5"></label>
    <label><span>Scale <output id="scaleOut"></output></span>
      <input id="scale" type="range" min="0.1" max="3" step="0.05" value="1"></label>
    <button id="pause">Pause (space)</button>
  </section>

  <section>
    <h2>Export</h2>
    <div data-row>
      <button id="png">Save PNG</button>
      <button id="rec">Record video</button>
    </div>
  </section>
</aside>

<main id="stage">
  <canvas id="out"></canvas>
  <div id="drop">Drop image</div>
</main>

<script>
const $ = id => document.getElementById(id);
const canvas = $('out');
const ctx = canvas.getContext('2d');
const sampler = document.createElement('canvas');
const sctx = sampler.getContext('2d', { willReadFrequently: true });

const PAIRS = [
  ['#0b0b0b', '#39ff14'], ['#101820', '#fee715'], ['#1a0033', '#ff3df2'],
  ['#f4efe6', '#1d1d1b'], ['#001f3f', '#7fdbff'], ['#2b0a0a', '#ff6b35'],
];

let source = null;          // image or canvas being converted
let cols = 0, rows = 0, cellW = 0, cellH = 0;
let lum = new Float32Array(0);
let palette = [];
let paused = false, time = 0, last = performance.now();

// ---------- Settings ----------

const sliders = ['cell', 'contrast', 'exposure', 'speed', 'amount', 'scale'];
const val = id => parseFloat($(id).value);

function glyphs() {
  const v = $('charset').value;
  const chars = v === 'custom' ? ($('custom').value || ' @') : v;
  return [...chars];
}

function updateOutputs() {
  for (const id of sliders) $(id + 'Out').textContent = $(id).value;
}

function buildPalette() {
  const a = hex($('c1').value), b = hex($('c2').value);
  palette = [];
  for (let i = 0; i < 32; i++) {
    const t = $('tonal').checked ? 0.15 + 0.85 * (i / 31) : 1;
    palette.push(`rgb(${mix(a[0], b[0], t)},${mix(a[1], b[1], t)},${mix(a[2], b[2], t)})`);
  }
}
const hex = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
const mix = (a, b, t) => Math.round(a + (b - a) * t);

// ---------- Layout and sampling ----------

function layout() {
  if (!source) return;
  const box = $('stage').getBoundingClientRect();
  const pad = innerWidth < 760 ? 32 : 48;
  const aw = box.width - pad, ah = box.height - pad;
  const ar = source.width / source.height;
  let w = aw, h = aw / ar;
  if (h > ah) { h = ah; w = ah * ar; }
  const dpr = devicePixelRatio || 1;
  canvas.style.width = w + 'px';
  canvas.style.height = h + 'px';
  canvas.width = Math.round(w * dpr);
  canvas.height = Math.round(h * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  const size = val('cell');
  cols = Math.max(4, Math.round(w / (size * 0.6)));
  rows = Math.max(4, Math.round(h / size));
  cellW = w / cols;
  cellH = h / rows;
  sample();
}

function sample() {
  sampler.width = cols;
  sampler.height = rows;
  sctx.drawImage(source, 0, 0, cols, rows);
  const px = sctx.getImageData(0, 0, cols, rows).data;
  const c = val('contrast'), e = val('exposure'), inv = $('invert').checked;
  lum = new Float32Array(cols * rows);
  for (let i = 0; i < lum.length; i++) {
    const r = px[i * 4], g = px[i * 4 + 1], b = px[i * 4 + 2], a = px[i * 4 + 3] / 255;
    let l = ((0.2126 * r + 0.7152 * g + 0.0722 * b) / 255) * a;
    l = (l - 0.5) * c + 0.5 + e;
    l = Math.min(1, Math.max(0, l));
    lum[i] = inv ? 1 - l : l;
  }
}

function lumAt(x, y) {
  x = Math.min(cols - 1, Math.max(0, Math.round(x)));
  y = Math.min(rows - 1, Math.max(0, Math.round(y)));
  return lum[y * cols + x];
}

const rand = (a, b) => { const n = Math.sin(a * 127.1 + b * 311.7) * 43758.5453; return n - Math.floor(n); };

// ---------- Rendering ----------

function render() {
  const now = performance.now();
  if (!paused) time += ((now - last) / 1000) * val('speed');
  last = now;

  const w = cols * cellW, h = rows * cellH;
  ctx.fillStyle = $('c1').value;
  ctx.fillRect(0, 0, w, h);
  if (!lum.length) return requestAnimationFrame(render);

  const g = glyphs(), n = g.length - 1;
  const mode = $('mode').value, amt = val('amount'), sc = val('scale'), t = time;
  const cx = cols / 2, cy = rows / 2;
  const step = Math.floor(t * 10);
  const band = ((t * 0.25) % 1.4 - 0.2) * rows;

  ctx.font = `${cellH * 1.05}px ui-monospace, Menlo, monospace`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  let lastColor = -1;

  for (let y = 0; y < rows; y++) {
    // per-row values
    let rowShift = 0, rowGlitch = false;
    if (mode === 'glitch' && rand(y * 0.37, step) < amt * 0.25) {
      rowGlitch = true;
      rowShift = (rand(y, step + 0.5) - 0.5) * amt * cols * 0.4;
    }

    for (let x = 0; x < cols; x++) {
      let sx = x, sy = y, boost = 0, scramble = false;

      switch (mode) {
        case 'wave':
          sx += Math.sin(y * 0.2 * sc + t * 2) * amt * 6;
          break;
        case 'liquid':
          sx += (Math.sin(y * 0.12 * sc + t) * 5 + Math.sin(y * 0.05 * sc - t * 0.7) * 4) * amt;
          sy += Math.cos(x * 0.1 * sc + t * 1.3) * amt * 3;
          break;
        case 'ripple': {
          const d = Math.hypot(x - cx, (y - cy) * cellH / cellW);
          const s = Math.sin(d * 0.25 * sc - t * 3);
          boost = s * amt * 0.45;
          sx += (x - cx) / (d || 1) * s * amt * 1.5;
          break;
        }
        case 'scan': {
          const k = Math.exp(-(((y - band) / (rows * 0.04 * sc)) ** 2));
          boost = k * amt * 0.8;
          sx += k * (rand(y, step) - 0.5) * amt * 6;
          break;
        }
        case 'glitch':
          if (rowGlitch) { sx += rowShift; scramble = rand(x, step + y) < amt * 0.5; }
          break;
        case 'scramble':
          scramble = rand(x + y * 0.13, Math.floor(t * 12) + y) < amt * 0.35;
          break;
        case 'rain': {
          const sp = 0.5 + rand(x, 1) * 1.5;
          const len = 4 + rand(x, 2) * 14 * sc;
          const head = (t * sp * 12 + rand(x, 3) * (rows + 30)) % (rows + 30) - 10;
          const dist = head - y;
          if (dist >= 0 && dist < len) {
            boost = (1 - dist / len) * amt;
            scramble = dist < 1;
          }
          break;
        }
      }

      let l = lumAt(sx, sy) + boost;
      l = l < 0 ? 0 : l > 1 ? 1 : l;
      let gi = Math.round(l * n);
      if (scramble) gi = 1 + Math.floor(rand(x * 3.1, y + step) * n);
      if (gi <= 0 || g[gi] === ' ') continue;

      const ci = Math.round(l * 31);
      if (ci !== lastColor) { ctx.fillStyle = palette[ci]; lastColor = ci; }
      ctx.fillText(g[gi], (x + 0.5) * cellW, (y + 0.5) * cellH);
    }
  }
  requestAnimationFrame(render);
}

// ---------- Image loading ----------

function loadFile(file) {
  if (!file || !file.type.startsWith('image/')) return;
  const url = URL.createObjectURL(file);
  const img = new Image();
  img.onload = () => { source = img; layout(); URL.revokeObjectURL(url); };
  img.src = url;
}

function demoImage() {
  const c = document.createElement('canvas');
  c.width = 1200; c.height = 800;
  const x = c.getContext('2d');
  const grad = x.createRadialGradient(600, 400, 20, 600, 400, 520);
  grad.addColorStop(0, '#fff');
  grad.addColorStop(0.5, '#777');
  grad.addColorStop(1, '#000');
  x.fillStyle = grad;
  x.fillRect(0, 0, 1200, 800);
  x.fillStyle = '#000';
  x.font = 'bold 150px Helvetica, Arial, sans-serif';
  x.textAlign = 'center';
  x.textBaseline = 'middle';
  x.fillText('DROP', 600, 330);
  x.fillText('AN IMAGE', 600, 480);
  return c;
}

$('pick').onclick = () => $('file').click();
$('file').onchange = e => loadFile(e.target.files[0]);

let dragDepth = 0;
addEventListener('dragenter', e => { e.preventDefault(); dragDepth++; document.body.dataset.drag = ''; });
addEventListener('dragleave', () => { if (--dragDepth <= 0) { dragDepth = 0; delete document.body.dataset.drag; } });
addEventListener('dragover', e => e.preventDefault());
addEventListener('drop', e => {
  e.preventDefault();
  dragDepth = 0;
  delete document.body.dataset.drag;
  loadFile(e.dataTransfer.files[0]);
});
addEventListener('paste', e => {
  const item = [...e.clipboardData.items].find(i => i.type.startsWith('image/'));
  if (item) loadFile(item.getAsFile());
});

// ---------- Controls ----------

for (const id of sliders) $(id).addEventListener('input', () => {
  updateOutputs();
  if (id === 'cell') layout();
  else if (id === 'contrast' || id === 'exposure') source && sample();
});
$('invert').onchange = () => source && sample();
$('charset').onchange = () => { $('custom').hidden = $('charset').value !== 'custom'; };
for (const id of ['c1', 'c2', 'tonal']) $(id).addEventListener('input', buildPalette);

$('swap').onclick = () => {
  [$('c1').value, $('c2').value] = [$('c2').value, $('c1').value];
  buildPalette();
};

for (const [a, b] of PAIRS) {
  const btn = document.createElement('button');
  btn.style.background = `linear-gradient(135deg, ${a} 50%, ${b} 50%)`;
  btn.title = `${a} / ${b}`;
  btn.onclick = () => { $('c1').value = a; $('c2').value = b; buildPalette(); };
  $('swatches').append(btn);
}

function togglePause() {
  paused = !paused;
  $('pause').textContent = paused ? 'Play (space)' : 'Pause (space)';
}
$('pause').onclick = togglePause;
addEventListener('keydown', e => {
  if (e.code === 'Space' && !/INPUT|SELECT|TEXTAREA/.test(e.target.tagName)) {
    e.preventDefault();
    togglePause();
  }
});

function download(blob, name) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

$('png').onclick = () => canvas.toBlob(b => download(b, 'ascii.png'));

let recorder = null;
$('rec').onclick = () => {
  if (recorder) { recorder.stop(); return; }
  const type = ['video/webm;codecs=vp9', 'video/webm', 'video/mp4'].find(t => MediaRecorder.isTypeSupported(t));
  const chunks = [];
  recorder = new MediaRecorder(canvas.captureStream(30), { mimeType: type, videoBitsPerSecond: 8e6 });
  recorder.ondataavailable = e => chunks.push(e.data);
  recorder.onstop = () => {
    download(new Blob(chunks, { type }), type.includes('mp4') ? 'ascii.mp4' : 'ascii.webm');
    recorder = null;
    $('rec').textContent = 'Record video';
    delete $('rec').dataset.on;
  };
  recorder.start();
  $('rec').textContent = '■ Stop recording';
  $('rec').dataset.on = '';
};

// ---------- Start ----------

new ResizeObserver(layout).observe($('stage'));
updateOutputs();
buildPalette();
source = demoImage();
layout();
requestAnimationFrame(render);
</script>
</body>
</html>
