<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>schwendis first website</title>
<style>
  :root {
    --bg: #f6f4f2;
    --panel: #fdfcfb;
    --text: #2b2424;
    --muted: #8f8686;
    --line: #e8e3e0;
    --chip: #efebe8;
    --accent: #eb5795;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #121111;
      --panel: #1a1818;
      --text: #ece7e4;
      --muted: #847b7b;
      --line: #2c2828;
      --chip: #252222;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #121111;
    --panel: #1a1818;
    --text: #ece7e4;
    --muted: #847b7b;
    --line: #2c2828;
    --chip: #252222;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 13px/1.4 system-ui, -apple-system, sans-serif;
    display: grid;
    grid-template-columns: 264px 1fr;
    overflow: hidden;
    transition: background .2s, color .2s;
  }
  button, select, input { font: inherit; color: inherit; }
  button { cursor: pointer; background: none; border: 0; padding: 0; }

  aside {
    background: var(--panel);
    border-right: 1px solid var(--line);
    padding: 22px 22px 28px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 26px;
  }
  header { display: flex; align-items: center; justify-content: space-between; }
  h1 { font: 600 13px/1 ui-monospace, Menlo, monospace; letter-spacing: .02em; margin: 0; }
  #theme {
    width: 28px; height: 28px;
    border-radius: 50%;
    display: grid; place-items: center;
    color: var(--muted);
  }
  #theme:hover { color: var(--text); background: var(--chip); }

  h2 {
    font-size: 11px;
    font-weight: 500;
    color: var(--muted);
    margin: 0 0 10px;
  }

  #pick {
    width: 100%;
    padding: 16px 10px;
    border: 1px dashed var(--line);
    border-radius: 10px;
    color: var(--muted);
    text-align: center;
  }
  #pick:hover { border-color: var(--muted); color: var(--text); }

  [data-chips] { display: flex; flex-wrap: wrap; gap: 6px; }
  [data-chips] button {
    padding: 5px 10px;
    border-radius: 99px;
    background: var(--chip);
    color: var(--muted);
  }
  [data-chips] button:hover { color: var(--text); }
  [data-chips] button[data-on] { background: var(--text); color: var(--panel); }

  label { display: block; }
  label + label { margin-top: 12px; }
  label > span { display: flex; justify-content: space-between; margin-bottom: 6px; }
  label output { color: var(--muted); font-variant-numeric: tabular-nums; }

  input[type=range] {
    -webkit-appearance: none;
    appearance: none;
    width: 100%;
    height: 14px;
    background: transparent;
    margin: 0;
  }
  input[type=range]::-webkit-slider-runnable-track { height: 2px; background: var(--line); border-radius: 2px; }
  input[type=range]::-moz-range-track { height: 2px; background: var(--line); border-radius: 2px; }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 12px; height: 12px;
    margin-top: -5px;
    border-radius: 50%;
    background: var(--text);
    border: 0;
  }
  input[type=range]::-moz-range-thumb { width: 12px; height: 12px; border-radius: 50%; background: var(--text); border: 0; }

  [data-swatches] { display: flex; align-items: center; gap: 7px; }
  [data-swatches] button, input[type=color] {
    width: 22px; height: 22px;
    border-radius: 50%;
    box-shadow: inset 0 0 0 1px rgba(0,0,0,.08);
  }
  [data-swatches] button[data-on] { outline: 1.5px solid var(--text); outline-offset: 2px; }
  input[type=color] {
    -webkit-appearance: none;
    appearance: none;
    border: 0;
    padding: 0;
    cursor: pointer;
    background: conic-gradient(#eb5795, #e84b1e, #bcbcbb, #acc4e5, #4f6150, #eb5795);
  }
  input[type=color]::-webkit-color-swatch-wrapper { padding: 0; }
  input[type=color]::-webkit-color-swatch { border: 0; border-radius: 50%; opacity: 0; }
  input[type=color]::-moz-color-swatch { border: 0; border-radius: 50%; opacity: 0; }
  [data-swatches] + h2 { margin-top: 16px; }

  [data-toggle] { display: flex; align-items: center; justify-content: space-between; margin-top: 14px; }
  [data-toggle] { cursor: pointer; }
  input[type=checkbox] {
    -webkit-appearance: none;
    appearance: none;
    flex: none;
    position: relative;
    width: 32px; height: 18px;
    margin: 0;
    border-radius: 99px;
    background: var(--line);
    cursor: pointer;
    transition: background .15s;
  }
  input[type=checkbox]::before {
    content: '';
    position: absolute;
    top: 2px; left: 2px;
    width: 14px; height: 14px;
    border-radius: 50%;
    background: var(--panel);
    box-shadow: 0 1px 2px rgba(0,0,0,.2);
    transition: transform .15s;
  }
  input[type=checkbox]:checked { background: var(--text); }
  input[type=checkbox]:checked::before { transform: translateX(14px); }

  select {
    width: 100%;
    background: var(--chip);
    border: 0;
    border-radius: 8px;
    padding: 7px 9px;
    margin-bottom: 12px;
  }

  details summary {
    cursor: pointer;
    color: var(--muted);
    font-size: 11px;
    font-weight: 500;
    list-style: none;
  }
  details summary::before { content: '+ '; }
  details[open] summary::before { content: '– '; }
  details[open] summary { margin-bottom: 12px; }

  footer { margin-top: auto; display: flex; gap: 8px; }
  footer button {
    flex: 1;
    padding: 9px 0;
    border-radius: 8px;
    background: var(--chip);
  }
  footer button:hover { background: var(--line); }
  #rec[data-on] { background: var(--accent); color: #fff; }

  main {
    position: relative;
    display: grid;
    place-items: center;
    overflow: hidden;
  }
  canvas { display: block; border-radius: 4px; }
  #play {
    position: absolute;
    bottom: 18px; right: 18px;
    width: 34px; height: 34px;
    border-radius: 50%;
    background: var(--panel);
    color: var(--text);
    box-shadow: 0 1px 4px rgba(0,0,0,.12);
    display: grid; place-items: center;
  }
  #drop {
    position: absolute;
    inset: 14px;
    border: 1.5px dashed var(--text);
    border-radius: 14px;
    display: grid;
    place-items: center;
    color: var(--text);
    background: color-mix(in srgb, var(--bg) 80%, transparent);
    opacity: 0;
    pointer-events: none;
    transition: opacity .15s;
  }
  body[data-drag] #drop { opacity: 1; }
  #status {
    position: absolute;
    bottom: 18px; left: 18px;
    padding: 8px 14px;
    border-radius: 99px;
    background: var(--panel);
    color: var(--text);
    box-shadow: 0 1px 4px rgba(0,0,0,.12);
  }
  #status:empty { display: none; }

  @media (max-width: 760px) {
    /* image stays pinned to the top while the controls scroll underneath */
    body { display: flex; flex-direction: column; overflow: auto; font-size: 15px; }
    main {
      order: -1;
      flex: none;
      position: sticky;
      top: 0;
      z-index: 2;
      height: 46vh;
      height: 46svh;
      background: var(--bg);
      border-bottom: 1px solid var(--line);
    }
    aside { border-right: 0; padding: 22px 16px 40px; gap: 30px; overflow: visible; }
    button, select, input { touch-action: manipulation; }

    h2, details summary { font-size: 13px; }
    #pick { padding: 20px 10px; }
    [data-chips] { gap: 8px; }
    [data-chips] button { padding: 9px 15px; }
    [data-swatches] { gap: 10px; }
    [data-swatches] button, input[type=color] { width: 32px; height: 32px; }
    select { padding: 11px 12px; }
    footer button { padding: 13px 0; }
    #theme, #play { width: 40px; height: 40px; }
    #play { bottom: 12px; right: 12px; }
    #status { bottom: 12px; left: 12px; }

    label + label { margin-top: 16px; }
    input[type=range] { height: 36px; touch-action: pan-y; }
    input[type=range]::-webkit-slider-runnable-track { height: 4px; }
    input[type=range]::-moz-range-track { height: 4px; }
    input[type=range]::-webkit-slider-thumb { width: 26px; height: 26px; margin-top: -11px; }
    input[type=range]::-moz-range-thumb { width: 26px; height: 26px; }

    input[type=checkbox] { width: 46px; height: 28px; }
    input[type=checkbox]::before { top: 3px; left: 3px; width: 22px; height: 22px; }
    input[type=checkbox]:checked::before { transform: translateX(18px); }
  }
</style>
</head>
<body>
<aside>
  <header>
    <h1>schwendis first website</h1>
    <button id="theme" title="Toggle light / dark" aria-label="Toggle light / dark">
      <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="8" cy="8" r="6.25"/><path d="M8 1.75a6.25 6.25 0 0 1 0 12.5z" fill="currentColor"/></svg>
    </button>
  </header>

  <div>
    <button id="pick">Drop, paste or choose an image</button>
    <input id="file" type="file" accept="image/*" hidden>
    <label data-toggle>Remove background <input id="removeBg" type="checkbox"></label>
  </div>

  <div>
    <h2>Motion</h2>
    <div data-chips id="modes"></div>
    <div style="margin-top:16px">
      <label><span>Speed <output id="speedOut"></output></span>
        <input id="speed" type="range" min="0" max="3" step="0.05" value="2.5"></label>
      <label><span>Amount <output id="amountOut"></output></span>
        <input id="amount" type="range" min="0" max="1" step="0.01" value="1"></label>
      <label><span>Scale <output id="scaleOut"></output></span>
        <input id="scale" type="range" min="0" max="3" step="0.05" value="1.85"></label>
      <label><span>3D spin <output id="spinOut"></output></span>
        <input id="spin" type="range" min="0" max="2" step="0.05" value="0"></label>
    </div>
  </div>

  <div>
    <h2>Background</h2>
    <div data-swatches id="bgSwatches"><input id="c1" type="color" value="#eb5795" title="Custom"></div>
    <h2>Glyphs</h2>
    <div data-swatches id="fgSwatches"><input id="c2" type="color" value="#acc4e5" title="Custom"></div>
    <label data-toggle>Tonal fade <input id="tonal" type="checkbox" checked></label>
  </div>

  <div>
    <h2>Characters</h2>
    <select id="charset">
      <option value="pixel">Pixel</option>
      <option value="stars">Stars</option>
      <option value=" .:-=+*#%@">Standard</option>
      <option value=" .'`^,:;Il!i~+_-?][}{1)(|/tfjrxnuvczXYUJCLQ0OZmwqpdbkhao*#MW&8%B@$">Detailed</option>
      <option value=" ░▒▓█" selected>Blocks</option>
      <option value=" ·•●">Dots</option>
      <option value=" 01">Binary</option>
      <option value=" ｱｲｳｴｵｶｷｸｹｺ">Katakana</option>
      <option value="custom">Custom…</option>
    </select>
    <input id="custom" type="text" value=" .oO@" hidden placeholder="dark → light"
      style="width:100%;margin:-4px 0 12px;padding:7px 9px;border:0;border-radius:8px;background:var(--chip);font-family:ui-monospace,Menlo,monospace">
    <label><span>Cell size <output id="cellOut"></output></span>
      <input id="cell" type="range" min="2" max="36" value="3"></label>
  </div>

  <details>
    <summary>Adjust image</summary>
    <label><span>Contrast <output id="contrastOut"></output></span>
      <input id="contrast" type="range" min="0.5" max="3" step="0.05" value="1.3"></label>
    <label><span>Exposure <output id="exposureOut"></output></span>
      <input id="exposure" type="range" min="-0.5" max="0.5" step="0.01" value="0"></label>
    <label data-toggle>Invert <input id="invert" type="checkbox"></label>
  </details>

  <footer>
    <button id="png">Save PNG</button>
    <button id="rec">Record</button>
  </footer>
</aside>

<main id="stage">
  <canvas id="out"></canvas>
  <button id="play" title="Pause (space)" aria-label="Pause"></button>
  <div id="status"></div>
  <div id="drop">Drop image</div>
</main>

<script>
const $ = id => document.getElementById(id);
const canvas = $('out');
const ctx = canvas.getContext('2d');
const sampler = document.createElement('canvas');
const sctx = sampler.getContext('2d', { willReadFrequently: true });

const COLORS = ['#4f6150', '#eb5795', '#acc4e5', '#513f3f', '#e84b1e', '#bcbcbb'];
const MODES = {
  wave: 'Wave', liquid: 'Liquid', ripple: 'Ripple', scan: 'Scan',
  glitch: 'Glitch', scramble: 'Scramble', rain: 'Rain', none: 'Still',
};
const ICON_PAUSE = '<svg width="12" height="12" viewBox="0 0 12 12" fill="currentColor"><rect x="2" y="1" width="3" height="10" rx="1"/><rect x="7" y="1" width="3" height="10" rx="1"/></svg>';
const ICON_PLAY = '<svg width="12" height="12" viewBox="0 0 12 12" fill="currentColor"><path d="M3 1.5v9l7.5-4.5z"/></svg>';

let source = null;          // image or canvas being converted
let isCutout = false;       // source has its background removed
let mode = 'scramble';
let alpha = new Float32Array(0);
let tiles = [];
let cols = 0, rows = 0, cellW = 0, cellH = 0;
let lum = new Float32Array(0);
let palette = [];
let paused = false, time = 0, angle = 0, last = performance.now();
const SPIN_DIST = 2.6;      // camera distance, in half card widths
const SPIN_FIT = 0.86;      // shrink so the turning card stays inside the frame

// ---------- Theme ----------

const root = document.documentElement;
try { const t = localStorage.getItem('theme'); if (t) root.dataset.theme = t; } catch {}
$('theme').onclick = () => {
  const dark = root.dataset.theme ? root.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  root.dataset.theme = dark ? 'light' : 'dark';
  try { localStorage.setItem('theme', root.dataset.theme); } catch {}
};

// ---------- Settings ----------

const sliders = ['cell', 'contrast', 'exposure', 'speed', 'amount', 'scale', 'spin'];
const val = id => parseFloat($(id).value);

function glyphs() {
  const v = $('charset').value;
  const chars = v === 'custom' ? ($('custom').value || ' @') : v;
  return [...chars];
}

function updateOutputs() {
  for (const id of sliders) $(id + 'Out').textContent = $(id).value;
}

function buildPalette() {
  const a = hex($('c1').value), b = hex($('c2').value);
  palette = [];
  for (let i = 0; i < 32; i++) {
    const t = $('tonal').checked ? 0.15 + 0.85 * (i / 31) : 1;
    palette.push(`rgb(${mix(a[0], b[0], t)},${mix(a[1], b[1], t)},${mix(a[2], b[2], t)})`);
  }
  buildTiles();
  markSwatches();
}
const isPixel = () => $('charset').value === 'pixel' || isStars();
const isStars = () => $('charset').value === 'stars';
const hex = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
const mix = (a, b, t) => Math.round(a + (b - a) * t);

// ---------- Layout and sampling ----------

function layout() {
  if (!source) return;
  const box = $('stage').getBoundingClientRect();
  const pad = innerWidth < 760 ? 32 : 64;
  const aw = box.width - pad, ah = box.height - pad;
  const ar = source.width / source.height;
  let w = aw, h = aw / ar;
  if (h > ah) { h = ah; w = ah * ar; }
  const dpr = devicePixelRatio || 1;
  canvas.style.width = w + 'px';
  canvas.style.height = h + 'px';
  canvas.width = Math.round(w * dpr);
  canvas.height = Math.round(h * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  const size = val('cell');
  ctx.imageSmoothingEnabled = false;
  cols = Math.max(4, Math.round(w / (size * (isPixel() ? 1 : 0.6))));
  rows = Math.max(4, Math.round(h / size));
  cellW = w / cols;
  cellH = h / rows;
  buildTiles();
  sample();
}

// square tiles for the pixel style: solid, stripes, dots
function buildTiles() {
  if (!cellW) return;
  const S = Math.max(2, Math.ceil(cellW * (devicePixelRatio || 1)));
  const main = $('c2').value;
  const c = hex(main);
  const light = `rgb(${mix(c[0], 255, 0.85)},${mix(c[1], 255, 0.85)},${mix(c[2], 255, 0.85)})`;
  const tile = draw => {
    const t = document.createElement('canvas');
    t.width = t.height = S;
    const x = t.getContext('2d');
    x.fillStyle = main;
    x.fillRect(0, 0, S, S);
    x.fillStyle = light;
    draw(x);
    return t;
  };
  const line = Math.max(1, Math.round(S * 0.09));
  const dot = Math.max(1, Math.round(S * 0.14));

  // stars style: black stars in the dark parts, fine dots in the mid tones, plain in the light
  if (isStars()) {
    tiles = [null,
      tile(x => {
        x.fillStyle = '#000';
        x.beginPath();
        for (let i = 0; i < 10; i++) {
          const r = S * (i % 2 ? 0.17 : 0.42), a = -Math.PI / 2 + i * Math.PI / 5;
          x.lineTo(S / 2 + r * Math.cos(a), S * 0.53 + r * Math.sin(a));
        }
        x.fill();
      }),
      tile(x => {
        x.fillStyle = '#000';
        for (const a of [1 / 6, 0.5, 5 / 6]) for (const b of [1 / 6, 0.5, 5 / 6]) {
          x.beginPath();
          x.arc(S * a, S * b, Math.max(0.5, S * 0.08), 0, Math.PI * 2);
          x.fill();
        }
      }),
      tile(() => {}),
    ];
    return;
  }

  tiles = [null, tile(() => {}),
    tile(x => { for (let i = 0; i < 4; i++) x.fillRect(Math.round(S * (0.14 + i * 0.22)), 0, line, S); }),
    tile(x => {
      for (const a of [0.2, 0.5, 0.8]) for (const b of [0.2, 0.5, 0.8])
        x.fillRect(Math.round(S * a - dot / 2), Math.round(S * b - dot / 2), dot, dot);
    }),
  ];
}

function sample() {
  sampler.width = cols;
  sampler.height = rows;
  sctx.drawImage(source, 0, 0, cols, rows);
  const px = sctx.getImageData(0, 0, cols, rows).data;
  const c = val('contrast'), e = val('exposure'), inv = $('invert').checked;
  const raw = new Float32Array(cols * rows);
  alpha = new Float32Array(cols * rows);
  const visible = [];
  for (let i = 0; i < raw.length; i++) {
    raw[i] = (0.2126 * px[i * 4] + 0.7152 * px[i * 4 + 1] + 0.0722 * px[i * 4 + 2]) / 255;
    alpha[i] = px[i * 4 + 3] / 255;
    if (alpha[i] > 0.08) visible.push(raw[i]);
  }

  // stretch the subject's tones over the full character range
  visible.sort((a, b) => a - b);
  let lo = 0, hi = 1;
  if (visible.length > 10) {
    lo = visible[Math.floor(visible.length * 0.02)];
    hi = visible[Math.floor(visible.length * 0.98)];
    if (hi - lo < 0.05) { lo = 0; hi = 1; }
  }

  // -1 marks empty background
  lum = new Float32Array(cols * rows);
  for (let i = 0; i < lum.length; i++) {
    if (alpha[i] <= 0.08) { lum[i] = -1; continue; }
    let l = (raw[i] - lo) / (hi - lo);
    l = (l - 0.5) * c + 0.5 + e;
    l = Math.min(1, Math.max(0, l));
    lum[i] = (inv ? 1 - l : l) * alpha[i];
  }
}

function alphaAt(x, y) {
  x = Math.min(cols - 1, Math.max(0, Math.round(x)));
  y = Math.min(rows - 1, Math.max(0, Math.round(y)));
  return alpha[y * cols + x];
}

function lumAt(x, y) {
  x = Math.min(cols - 1, Math.max(0, Math.round(x)));
  y = Math.min(rows - 1, Math.max(0, Math.round(y)));
  return lum[y * cols + x];
}

const rand = (a, b) => { const n = Math.sin(a * 127.1 + b * 311.7) * 43758.5453; return n - Math.floor(n); };

// ---------- Rendering ----------

function render() {
  const now = performance.now();
  const dt = (now - last) / 1000;
  if (!paused) { time += dt * val('speed'); angle += dt * val('spin'); }
  last = now;

  const w = cols * cellW, h = rows * cellH;
  ctx.fillStyle = $('c1').value;
  ctx.fillRect(0, 0, w, h);
  if (!lum.length) return requestAnimationFrame(render);

  const pixel = isPixel();
  const g = glyphs(), n = g.length - 1;
  const amt = val('amount'), sc = val('scale'), t = time;
  const cx = cols / 2, cy = rows / 2;
  const step = Math.floor(t * 10);
  const band = ((t * 0.25) % 1.4 - 0.2) * rows;
  const spin = val('spin') > 0, cs = Math.cos(angle), sn = Math.sin(angle);

  ctx.font = `${cellH * 1.05}px ui-monospace, Menlo, monospace`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  let lastColor = -1;

  for (let y = 0; y < rows; y++) {
    // per-row values
    let rowShift = 0, rowGlitch = false;
    if (mode === 'glitch' && rand(y * 0.37, step) < amt * 0.25) {
      rowGlitch = true;
      rowShift = (rand(y, step + 0.5) - 0.5) * amt * cols * 0.4;
    }

    for (let x = 0; x < cols; x++) {
      let sx = x, sy = y, boost = 0, scramble = false;

      if (spin) {
        // the image is a card turning around its vertical axis, seen in perspective:
        // find which point (u, v) on the card lands on this screen cell
        const X = (x + 0.5 - cols / 2) / (cols / 2) / SPIN_FIT;
        const Y = (y + 0.5 - rows / 2) / (rows / 2) / SPIN_FIT;
        const den = cs * SPIN_DIST - X * sn;
        if (Math.abs(den) < 1e-4) continue;
        const u = X * SPIN_DIST / den;
        const z = SPIN_DIST + u * sn;
        if (u < -1 || u > 1 || z <= 0) continue;
        const v = Y * z / SPIN_DIST;
        if (v < -1 || v > 1) continue;
        sx = (u + 1) * cols / 2 - 0.5;
        sy = (v + 1) * rows / 2 - 0.5;
      }

      switch (mode) {
        case 'wave':
          sx += Math.sin(y * 0.2 * sc + t * 2) * amt * 6;
          break;
        case 'liquid':
          sx += (Math.sin(y * 0.12 * sc + t) * 5 + Math.sin(y * 0.05 * sc - t * 0.7) * 4) * amt;
          sy += Math.cos(x * 0.1 * sc + t * 1.3) * amt * 3;
          break;
        case 'ripple': {
          const d = Math.hypot(x - cx, (y - cy) * cellH / cellW);
          const s = Math.sin(d * 0.25 * sc - t * 3);
          boost = s * amt * 0.45;
          sx += (x - cx) / (d || 1) * s * amt * 1.5;
          break;
        }
        case 'scan': {
          const k = Math.exp(-(((y - band) / (rows * 0.04 * sc)) ** 2));
          boost = k * amt * 0.8;
          sx += k * (rand(y, step) - 0.5) * amt * 6;
          break;
        }
        case 'glitch':
          if (rowGlitch) { sx += rowShift; scramble = rand(x, step + y) < amt * 0.5; }
          break;
        case 'scramble':
          scramble = rand(x + y * 0.13, Math.floor(t * 12) + y) < amt * 0.35;
          break;
        case 'rain': {
          const sp = 0.5 + rand(x, 1) * 1.5;
          const len = 4 + rand(x, 2) * 14 * sc;
          const head = (t * sp * 12 + rand(x, 3) * (rows + 30)) % (rows + 30) - 10;
          const dist = head - y;
          if (dist >= 0 && dist < len) {
            boost = (1 - dist / len) * amt;
            scramble = dist < 1;
          }
          break;
        }
      }

      let l = lumAt(sx, sy);
      if (l < 0) continue;
      l += boost;
      l = l < 0 ? 0 : l > 1 ? 1 : l;
      if (pixel) {
        // a cut-out subject keeps its full silhouette, even in the darkest parts
        let k = l < 0.1 && !isCutout ? 0 : l < 0.62 ? 1 : l < 0.82 ? 2 : 3;
        if (scramble) k = 1 + Math.floor(rand(x * 3.1, y + step) * 3);
        if (!k) continue;
        const a = alphaAt(sx, sy);
        ctx.globalAlpha = a < 0.9 ? Math.max(0.35, a) : 1;
        const px0 = Math.round(x * cellW), py0 = Math.round(y * cellH);
        ctx.drawImage(tiles[k], px0, py0, Math.round((x + 1) * cellW) - px0, Math.round((y + 1) * cellH) - py0);
        continue;
      }

      let gi = isCutout ? 1 + Math.round(l * (n - 1)) : Math.round(l * n);
      if (scramble) gi = 1 + Math.floor(rand(x * 3.1, y + step) * n);
      if (gi <= 0 || g[gi] === ' ') continue;

      const ci = isCutout ? 8 + Math.round(l * 23) : Math.round(l * 31);
      if (ci !== lastColor) { ctx.fillStyle = palette[ci]; lastColor = ci; }
      ctx.fillText(g[gi], (x + 0.5) * cellW, (y + 0.5) * cellH);
    }
  }
  ctx.globalAlpha = 1;
  requestAnimationFrame(render);
}

// ---------- Image loading ----------

const BG_LIB = 'https://cdn.jsdelivr.net/npm/@imgly/background-removal@1.7.0/+esm';
let bgLib = null;
let original = null, cutout = null;

function loadImage(blob) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(blob);
    const img = new Image();
    img.onload = () => { URL.revokeObjectURL(url); resolve(img); };
    img.onerror = reject;
    img.src = url;
  });
}

function status(text) {
  $('status').textContent = text;
}

async function loadFile(file) {
  if (!file || !file.type.startsWith('image/')) return;
  original = { file, img: await loadImage(file) };
  cutout = null;
  applySource();
}

async function applySource() {
  if (!original) return;
  if (!$('removeBg').checked) { setSource(original.img, false); return; }

  if (!cutout) {
    const job = original;
    setSource(job.img, false);
    status('Removing background… the first time takes a moment');
    try {
      const { removeBackground } = await (bgLib ||= import(BG_LIB));
      const blob = await removeBackground(job.file, { output: { format: 'image/png' } });
      if (job !== original) return;
      cutout = await loadImage(blob);
      status('');
    } catch (err) {
      console.error(err);
      status('Background removal failed – showing the original');
      setTimeout(() => status(''), 4000);
      return;
    }
  }
  setSource(cropToSubject(cutout), true);
}

function setSource(img, cut) {
  source = img;
  isCutout = cut;
  layout();
}

// crop to the visible subject so it fills the frame
function cropToSubject(img) {
  const k = Math.min(1, 400 / Math.max(img.width, img.height));
  const w = Math.round(img.width * k), h = Math.round(img.height * k);
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const x = c.getContext('2d', { willReadFrequently: true });
  x.drawImage(img, 0, 0, w, h);
  const a = x.getImageData(0, 0, w, h).data;
  let x0 = w, y0 = h, x1 = -1, y1 = -1;
  for (let y = 0; y < h; y++) for (let i = 0; i < w; i++) {
    if (a[(y * w + i) * 4 + 3] > 25) {
      if (i < x0) x0 = i; if (i > x1) x1 = i;
      if (y < y0) y0 = y; if (y > y1) y1 = y;
    }
  }
  if (x1 < 0) return img;
  const pad = Math.max(x1 - x0, y1 - y0) * 0.06;
  const sx = Math.max(0, (x0 - pad) / k), sy = Math.max(0, (y0 - pad) / k);
  const sw = Math.min(img.width, (x1 + pad) / k) - sx, sh = Math.min(img.height, (y1 + pad) / k) - sy;
  const out = document.createElement('canvas');
  out.width = Math.round(sw); out.height = Math.round(sh);
  out.getContext('2d').drawImage(img, sx, sy, sw, sh, 0, 0, out.width, out.height);
  return out;
}

function demoImage() {
  const c = document.createElement('canvas');
  c.width = 1200; c.height = 800;
  const x = c.getContext('2d');
  const grad = x.createRadialGradient(600, 400, 20, 600, 400, 520);
  grad.addColorStop(0, '#fff');
  grad.addColorStop(0.5, '#777');
  grad.addColorStop(1, '#000');
  x.fillStyle = grad;
  x.fillRect(0, 0, 1200, 800);
  x.fillStyle = '#000';
  x.font = 'bold 150px Helvetica, Arial, sans-serif';
  x.textAlign = 'center';
  x.textBaseline = 'middle';
  x.fillText('DROP', 600, 330);
  x.fillText('AN IMAGE', 600, 480);
  return c;
}

$('pick').onclick = () => $('file').click();
$('file').onchange = e => loadFile(e.target.files[0]);

let dragDepth = 0;
addEventListener('dragenter', e => { e.preventDefault(); dragDepth++; document.body.dataset.drag = ''; });
addEventListener('dragleave', () => { if (--dragDepth <= 0) { dragDepth = 0; delete document.body.dataset.drag; } });
addEventListener('dragover', e => e.preventDefault());
addEventListener('drop', e => {
  e.preventDefault();
  dragDepth = 0;
  delete document.body.dataset.drag;
  loadFile(e.dataTransfer.files[0]);
});
addEventListener('paste', e => {
  const item = [...e.clipboardData.items].find(i => i.type.startsWith('image/'));
  if (item) loadFile(item.getAsFile());
});

// ---------- Controls ----------

for (const id of sliders) $(id).addEventListener('input', () => {
  updateOutputs();
  if (id === 'cell') layout();
  else if (id === 'contrast' || id === 'exposure') source && sample();
});
$('invert').onchange = () => source && sample();
$('removeBg').onchange = applySource;
$('charset').onchange = () => {
  $('custom').hidden = $('charset').value !== 'custom';
  // stars need bigger cells to be visible
  if (isStars() && val('cell') < 8) { $('cell').value = 12; updateOutputs(); }
  layout();
};
$('custom').addEventListener('input', () => source && sample());
for (const id of ['c1', 'c2', 'tonal']) $(id).addEventListener('input', buildPalette);

for (const [key, name] of Object.entries(MODES)) {
  const btn = document.createElement('button');
  btn.textContent = name;
  btn.dataset.mode = key;
  btn.onclick = () => { mode = key; markModes(); };
  $('modes').append(btn);
}
function markModes() {
  for (const b of $('modes').children) b.toggleAttribute('data-on', b.dataset.mode === mode);
}

for (const [row, input] of [['bgSwatches', 'c1'], ['fgSwatches', 'c2']]) {
  for (const color of COLORS) {
    const btn = document.createElement('button');
    btn.style.background = color;
    btn.dataset.color = color;
    btn.title = color;
    btn.onclick = () => { $(input).value = color; buildPalette(); };
    $(row).insertBefore(btn, $(input));
  }
}
function markSwatches() {
  for (const [row, input] of [['bgSwatches', 'c1'], ['fgSwatches', 'c2']]) {
    const v = $(input).value.toLowerCase();
    for (const b of $(row).querySelectorAll('button')) b.toggleAttribute('data-on', b.dataset.color === v);
    // a custom pick shows its own color on the picker dot
    const custom = !COLORS.includes(v);
    $(input).style.background = custom ? v : '';
    $(input).style.outline = custom ? '1.5px solid var(--text)' : '';
    $(input).style.outlineOffset = '2px';
  }
}

function togglePause() {
  paused = !paused;
  $('play').innerHTML = paused ? ICON_PLAY : ICON_PAUSE;
  $('play').title = paused ? 'Play (space)' : 'Pause (space)';
}
$('play').onclick = togglePause;
addEventListener('keydown', e => {
  if (e.code === 'Space' && !/INPUT|SELECT|TEXTAREA/.test(e.target.tagName)) {
    e.preventDefault();
    togglePause();
  }
});

function download(blob, name) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

// downloads are numbered schwendis-1, schwendis-2, … and the count survives a reload
let fileCount = 0;
function nextName(ext) {
  try { fileCount = Math.max(fileCount, +localStorage.getItem('fileCount') || 0); } catch {}
  fileCount++;
  try { localStorage.setItem('fileCount', fileCount); } catch {}
  return `schwendis-${fileCount}.${ext}`;
}

$('png').onclick = () => canvas.toBlob(b => download(b, nextName('png')));

// recordings are saved as MP4; browsers without MP4 recording (Firefox) fall back to WebM
let recorder = null;
$('rec').onclick = () => {
  if (recorder) { recorder.stop(); return; }
  const type = ['video/mp4;codecs=avc1', 'video/mp4', 'video/webm;codecs=vp9', 'video/webm'].find(t => MediaRecorder.isTypeSupported(t));
  const chunks = [];
  recorder = new MediaRecorder(canvas.captureStream(30), { mimeType: type, videoBitsPerSecond: 8e6 });
  recorder.ondataavailable = e => chunks.push(e.data);
  recorder.onstop = () => {
    download(new Blob(chunks, { type }), nextName(type.includes('mp4') ? 'mp4' : 'webm'));
    recorder = null;
    $('rec').textContent = 'Record';
    delete $('rec').dataset.on;
  };
  recorder.start();
  $('rec').textContent = '■ Stop';
  $('rec').dataset.on = '';
};

// ---------- Start ----------

// on touch screens a slider jumps to where it is tapped and follows the finger
function setFromTouch(r, e) {
  const b = r.getBoundingClientRect();
  const k = Math.min(1, Math.max(0, (e.clientX - b.left) / b.width));
  const min = +r.min, max = +r.max, st = +r.step || 1;
  r.value = min + Math.round((k * (max - min)) / st) * st;
  r.dispatchEvent(new Event('input'));
}
for (const r of document.querySelectorAll('input[type=range]')) {
  r.addEventListener('pointerdown', e => {
    if (e.pointerType !== 'touch') return;
    e.preventDefault();
    r.setPointerCapture(e.pointerId);
    setFromTouch(r, e);
  });
  r.addEventListener('pointermove', e => {
    if (e.pointerType === 'touch' && r.hasPointerCapture(e.pointerId)) setFromTouch(r, e);
  });
}

new ResizeObserver(layout).observe($('stage'));
$('play').innerHTML = ICON_PAUSE;
updateOutputs();
markModes();
buildPalette();
source = demoImage();
layout();
requestAnimationFrame(render);
// the start image replaces the drawn placeholder once it has loaded
fetch('drop-image.png').then(r => r.blob()).then(b => { if (!original) loadFile(b); }).catch(() => {});
</script>
